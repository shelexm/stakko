    - id: task
      title: Задача
      big: Студии нужно принимать записи с сайта и из Telegram, вести расписание мастеров и услуги, обновлять контент без разработчика и не допускать, чтобы одно и то же время заняли через разные каналы.

    - title: Решение
      text: 'Единый продукт на FastAPI и PostgreSQL. Сайт, админ-панель и Telegram-бот используют одну базу данных и общий набор правил записи. Архитектура рассчитана на несколько студий: каждая запись привязана к своей студии.'
      arch:
        aria: 'Схема: сайт, админ-панель, Telegram-бот и Mini App работают через общий backend и одну базу данных'
