          - { image: ../../../assets/velox/works.png, label: Галерея «до/после», size: 1440 × 900, ratio: 16x10 }
          - { image: ../../../assets/velox/mobile.png, label: Мобильная версия, size: 390 × 844, ratio: 9x19 }

    - title: Онлайн-запись
      flow:
        steps:
          - { b: Услуга, d: Выбор из каталога студии }
          - { b: Мастер, d: 'Выбор специалиста, если услуга это допускает' }
          - { b: Время, d: Только свободные слоты }
          - { b: Контакты, d: 'Имя, телефон, модель авто по желанию' }
        result: { b: Подтверждение, d: 'Номер записи, файл для календаря и страница отмены до установленного срока' }
      after: 'Сайт, админ-панель и бот проверяют запись по одним и тем же правилам; пересечения по времени дополнительно контролируются ограничениями на уровне базы данных.'
      gallery:
        layout: single
