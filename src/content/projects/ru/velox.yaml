          - { k: Клиенты, b: Сайт, s: Jinja2 · JavaScript }
          - { k: Студия, b: Админ-панель, s: Роли и доступы }
          - { k: Клиенты и студия, b: Telegram-бот и Mini App, s: aiogram 3 }
        core: { k: Backend, b: FastAPI · общие правила записи, s: API · сервисный слой · Pydantic 2 }
        db: { k: Данные, b: PostgreSQL 17, s: SQLAlchemy 2 async · миграции Alembic }
        caption: 'Схема по структуре репозитория: app/web, app/bot, app/api, app/services, app/models.'

    - title: Сайт для клиентов
      text: 'Адаптивный сайт студии: услуги и цены, работы «до/после», отзывы, сертификаты и контакты. Тексты, фото и цены владелец меняет сам в админ-панели.'
      gallery:
        layout: gal3
