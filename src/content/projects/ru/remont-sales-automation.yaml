  sections:
    - id: task
      title: Задача
      big: Помочь ремонтной компании собирать обращения с сайта, передавать их менеджеру и не терять заявки при повторной отправке или временной ошибке интеграции.
      note: Изображение интерьера — демонстрационная иллюстрация, а не фотография выполненных работ.
    - title: Путь заявки
      text: Форма Tilda отправляет событие по HTTPS в приёмник. Приёмник проверяет данные и сохраняет событие в PostgreSQL до подтверждения. n8n по расписанию запускает обработку очереди; отдельный сервис синхронизирует заявку с CRM и отправляет уведомления.
      flow:
        steps:
          - { b: Tilda, d: 'Форма с типом ремонта, площадью и бюджетом' }
          - { b: Приёмник и PostgreSQL, d: 'Проверка, сохранение и защита от повторной доставки' }
          - { b: n8n, d: Запуск обработки сохранённой очереди }
        result: { b: CRM и Telegram, d: 'Сделка, уведомление и контроль просрочки' }
      after: Экспорт workflow хранится в репозитории. Проверка и интеграции реализованы отдельными сервисами и функциями базы, а не только узлами n8n.
      gallery:
        layout: single
        shots:
          - { image: ../../../assets/remont-sales/workflow-ru.png, label: Схема трёх узлов экспортированного workflow n8n, size: 1600 × 900, ratio: 16x9 }
      note: Это схема по экспорту workflow, а не скриншот редактора n8n.
    - title: Обработка и контроль
      panels:
        - title: Заявка
          items:
            - Проверка обязательных полей и нормализация телефона
            - Идемпотентность повторных webhook и классификация по бюджету
            - Контролируемые повторные попытки и журнал событий
        - title: Менеджер
          items:
            - Создание контакта и сделки в демонстрационной EspoCRM
            - Уведомление о заявке и напоминание о просрочке в Telegram
            - Локальная диагностика очереди и отчёт по принятым обращениям
    - title: Проверки
      text: Сквозной сценарий с вымышленными данными проверен через опубликованную форму Tilda, локальный приёмник, n8n, EspoCRM и Telegram. Получение уведомления и отдельного напоминания подтверждено вручную. В CI также запускаются автоматические тесты и smoke-проверка workflow; внешние интеграции в тестах подменяются.
      note: Некоторые ранние тестовые уведомления имеют неопределённый статус после сетевых сбоев; автоматическая доставка не гарантируется во всех ситуациях.
    - title: CRM и границы демо
      text: Для бесплатного локального стенда используется EspoCRM. В коде предусмотрен экспериментальный адаптер Bitrix24, проверенный с тестовыми ответами API; подключение к реальному аккаунту Bitrix24 ещё не проверено.
      list:
        - Демо работает на локальном компьютере в Docker; HTTPS-туннель временный и зависит от его работы.
        - Публичная форма предназначена только для вымышленных данных.
        - Для реальных клиентов необходимы постоянное размещение, защита доступа и проверенное хранение резервных копий.
