  sections:
    - id: task
      title: Задача
      big: Помочь ремонтной компании собирать обращения с сайта, передавать их менеджеру и не терять заявки при повторной отправке или временной ошибке интеграции.
      note: На скриншотах показана исходная версия на Tilda. Ссылка на демо ведёт на независимую страницу GitHub Pages с тестовой формой. Изображения интерьера демонстрационные, не фотографии выполненных ремонтов.
    - title: Путь заявки
      text: Изначально форма Tilda отправляла событие по HTTPS в приёмник. В независимом демо GitHub Pages тестовая форма передаёт вымышленные данные через отдельный ограниченный шлюз. Приёмник проверяет и сохраняет событие в PostgreSQL до подтверждения. n8n по расписанию запускает обработку очереди; отдельный сервис синхронизирует заявку с CRM и отправляет уведомления.
      flow:
        steps:
          - { b: Сайт, d: 'Tilda или тестовая форма GitHub Pages' }
          - { b: Приёмник и PostgreSQL, d: 'Проверка, сохранение и защита от повторной доставки' }
          - { b: n8n, d: Запуск обработки сохранённой очереди }
        result: { b: CRM и Telegram, d: 'Сделка, уведомление и контроль просрочки' }
      after: Экспорт workflow хранится в репозитории. Проверка и интеграции реализованы отдельными сервисами и функциями базы, а не только узлами n8n.
      gallery:
        layout: single
        shots:
          - { image: ../../../assets/remont-sales/n8n-workflow.jpg, label: Реальный редактор n8n с тремя узлами импортированного workflow, size: 1280 × 720, ratio: 16x9 }
      note: Скриншот сделан в отдельной копии n8n с импортированным workflow. В копию намеренно не добавлены доступы к базе и данные заявок, поэтому узлы PostgreSQL показывают предупреждения и workflow не запущен.
    - title: Workflow изнутри
      text: Расписание запускает процесс каждую минуту. Первый узел PostgreSQL захватывает доступное событие из очереди, второй передаёт его идентификатор и токен аренды в функцию обработки. На снимках показаны реальные настройки импортированного workflow без секретов.
      gallery:
        layout: gal3
        shots:
          - { image: ../../../assets/remont-sales/n8n-schedule.jpg, label: Расписание запуска каждую минуту, size: 1280 × 720, ratio: 16x9 }
          - { image: ../../../assets/remont-sales/n8n-claim.jpg, label: Запрос захвата заявки из очереди, size: 1280 × 720, ratio: 16x9 }
          - { image: ../../../assets/remont-sales/n8n-process.jpg, label: Обработка заявки с параметрами запроса, size: 1280 × 720, ratio: 16x9 }
    - title: Обработка и контроль
      panels:
        - title: Заявка
          items:
            - Проверка обязательных полей и нормализация телефона
            - Идемпотентность повторных webhook и классификация по бюджету
            - Контролируемые повторные попытки и журнал событий
        - title: Менеджер
          items:
            - Создание контакта и сделки в демонстрационной EspoCRM
            - Уведомление о заявке и напоминание о просрочке в Telegram
            - Локальная диагностика очереди и отчёт по принятым обращениям
    - title: Проверки
      text: С вымышленными данными проверен путь от формы Tilda до EspoCRM и Telegram; получение уведомления и напоминания подтверждено вручную. Публичная форма на GitHub Pages отдельно проверена с EspoCRM и Telegram. В отдельном контуре заявка прошла приёмник, разовый запуск n8n, реальный Bitrix24 и Telegram API. CI запускает автоматические тесты и smoke-проверку workflow; внешние интеграции там подменяются.
      note: Некоторые ранние тестовые уведомления имеют неопределённый статус после сетевых сбоев; автоматическая доставка не гарантируется во всех ситуациях.
    - title: Форма и CRM
      text: Исходная форма Tilda и независимая форма GitHub Pages показывают два варианта входа. На экране EspoCRM — сделки локального стенда; суммы и обращения вымышлены и не являются коммерческими результатами.
      gallery:
        layout: gal3
        shots:
          - { image: ../../../assets/remont-sales/pages-form.jpg, label: Форма GitHub Pages после приёма тестовой заявки, size: 1280 × 720, ratio: 16x9 }
          - { image: ../../../assets/remont-sales/tilda-form.jpg, label: Форма заявки на демонстрационном сайте Tilda, size: 1280 × 720, ratio: 16x9 }
          - { image: ../../../assets/remont-sales/espocrm-opportunities.jpg, label: Тестовые сделки в локальной EspoCRM, size: 1269 × 714, ratio: 16x9 }
    - title: CRM и границы демо
      text: "Для бесплатного локального демо используется EspoCRM. Экспериментальный адаптер Bitrix24 отдельно проверен на реальном портале: созданы тестовые контакт и сделка, считана стадия. Подписка Bitrix24 для вебхука потребовалась на проверенном аккаунте; публичная форма остаётся подключена к EspoCRM."
      list:
        - Обработка демо работает на локальном компьютере в Docker; HTTPS-туннель временный и зависит от его работы. Страница GitHub Pages доступна отдельно.
        - Публичная форма предназначена только для вымышленных данных.
        - Для реальных клиентов необходимы постоянное размещение, защита доступа и проверенное хранение резервных копий.
