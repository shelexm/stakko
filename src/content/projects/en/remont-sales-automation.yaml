  sections:
    - id: task
      title: The challenge
      big: Help a renovation company collect enquiries from its website, pass them to a manager and avoid losing leads when requests are repeated or an integration fails temporarily.
      note: Screenshots show the original Tilda version. The demo link opens an independent GitHub Pages site with a test form. Interior images are illustrative, not photographs of completed work.
    - title: The lead journey
      text: The original Tilda form sent HTTPS events to the receiver. In the independent GitHub Pages demo, a limited gateway forwards fictional test data. The receiver validates and saves the event in PostgreSQL before acknowledging it. n8n starts queue processing on a schedule; a separate service synchronises the lead with the CRM and sends notifications.
      flow:
        steps:
          - { b: Website, d: 'Tilda or the GitHub Pages test form' }
          - { b: Receiver and PostgreSQL, d: 'Validation, storage and duplicate-delivery protection' }
          - { b: n8n, d: Scheduled processing of the persisted queue }
        result: { b: CRM and Telegram, d: 'Opportunity, notification and overdue follow-up' }
      after: The exported workflow is versioned in the repository. Validation and integrations also use separate services and database functions, rather than n8n nodes alone.
      gallery:
        layout: single
        shots:
          - { image: ../../../assets/remont-sales/n8n-workflow.jpg, label: Actual n8n editor with the three imported workflow nodes, size: 1280 × 720, ratio: 16x9 }
      note: This screenshot shows a separate n8n instance with the exported workflow imported. Database credentials and lead data were deliberately omitted, so the PostgreSQL nodes display warnings and the workflow is not running in this copy.
    - title: Inside the workflow
      text: The schedule starts the process every minute. One PostgreSQL node claims an available event from the queue; the other passes its identifier and lease token to the processing function. Screenshots show the actual settings of the imported workflow with no secrets.
      gallery:
        layout: gal3
        shots:
          - { image: ../../../assets/remont-sales/n8n-schedule.jpg, label: Schedule configured to run every minute, size: 1280 × 720, ratio: 16x9 }
          - { image: ../../../assets/remont-sales/n8n-claim.jpg, label: Query to claim a lead from the queue, size: 1280 × 720, ratio: 16x9 }
          - { image: ../../../assets/remont-sales/n8n-process.jpg, label: Lead processing with query parameters, size: 1280 × 720, ratio: 16x9 }
    - title: Processing and follow-up
      panels:
        - title: Lead
          items:
            - Required-field validation and phone number normalisation
            - Idempotent webhook handling and budget classification
            - Controlled retries and technical event logging
        - title: Manager
          items:
            - Contact and opportunity creation in demo EspoCRM
            - Telegram lead notifications and overdue reminders
            - Local queue diagnostics and accepted-lead reporting
    - title: Verification
      text: The end-to-end path was tested with fictional data through the published Tilda form, local receiver, n8n, EspoCRM and Telegram. Receipt of a notification and a separate reminder was confirmed manually. CI also runs automated tests and an n8n workflow smoke test; external services are mocked in tests.
      note: Some early test notifications have an uncertain status after network failures; automatic delivery is not guaranteed in every situation.
    - title: Form and CRM
      text: The demo form collects renovation details. EspoCRM shows test opportunities created on the local demo; amounts and enquiries are fictional and do not represent commercial results.
      gallery:
        layout: gal2
        shots:
          - { image: ../../../assets/remont-sales/tilda-form.jpg, label: Lead form on the demonstration Tilda website, size: 1280 × 720, ratio: 16x9 }
          - { image: ../../../assets/remont-sales/espocrm-opportunities.jpg, label: Test opportunities in local EspoCRM, size: 1269 × 714, ratio: 16x9 }
    - title: CRM and demo boundaries
      text: The free local demo uses EspoCRM. An experimental Bitrix24 adapter has been tested against API test doubles; a real Bitrix24 account has not yet been tested.
      list:
        - Demo processing runs locally in Docker; the temporary HTTPS tunnel depends on the computer being online. The GitHub Pages site is hosted separately.
        - The public form is for fictional data only.
        - Real client use requires persistent hosting, access controls and verified backup storage.
