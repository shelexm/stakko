    - title: Testing and quality
      text: 'The pytest suite is split into unit, integration, API and bot tests, with an isolated environment of its own: a separate Docker Compose stack. Code is linted with ruff, and checks run in GitHub Actions.'
      tags: [tests/unit, tests/integration, tests/api, tests/bot, compose.test.yaml]
      metrics:
        - { status: pytest · Oct 22, 2026, value: '219', label: tests, note: 'Fresh run in the isolated stack: all tests pass.' }
        - { status: pytest-cov · Oct 22, 2026, value: 92%, label: line coverage, note: 'Measured with pytest-cov (coverage.py) over the app package, line coverage.' }
        - { status: GitHub · Oct 22, 2026, value: '127', label: commits on main, note: 'A supporting indicator of development history, not a quality metric.' }

    - title: Infrastructure and deployment
      infra:
        - { k: Docker Compose, text: 'Separate configurations for development, testing and production; memory limits are set for the server.' }
        - { k: Migrations, text: The database schema is versioned with Alembic. }
        - { k: Backups, text: 'Daily database and media backups, plus a copy before every update.' }
        - { k: Documentation, text: 'Installation, updates and backups are covered in `docs/deployment.md`.' }
        - { k: Personal data, text: 'Client data deletion on request, in line with Russian Federal Law 152-FZ.' }
      note: 'Server addresses, keys and credentials are not published in this case study.'

