  heroUrl: velox.stakko.online
  hero: { image: ../../../assets/velox/home.png, label: 'Home page, desktop', size: 1920 × 1080, ratio: 16x9 }
  sections:
    - id: task
      title: The problem
      big: 'The studio needed to take bookings from both the website and Telegram, manage staff schedules and services, update site content without a developer, and make sure the same time slot can’t be taken through two different channels.'

    - title: The solution
      text: 'A single product built on FastAPI and PostgreSQL. The website, admin panel and Telegram bot share one database and one set of booking rules. The architecture supports multiple studios: every booking belongs to its studio.'
      arch:
        aria: 'Diagram: the website, admin panel, Telegram bot and Mini App work through a shared backend and one database'
        top:
          - { k: Clients, b: Website, s: Jinja2 · JavaScript }
          - { k: Studio, b: Admin panel, s: Roles and access }
          - { k: Clients and studio, b: Telegram bot and Mini App, s: aiogram 3 }
        core: { k: Backend, b: FastAPI · shared booking rules, s: API · service layer · Pydantic 2 }
        db: { k: Data, b: PostgreSQL 17, s: SQLAlchemy 2 async · Alembic migrations }
        caption: 'Based on the repository structure: app/web, app/bot, app/api, app/services, app/models.'

    - title: Client-facing website
      text: 'A responsive studio website: services and prices, before/after work, reviews, gift certificates and contacts. The owner edits texts, photos and prices in the admin panel. Screenshots show the product in Russian, its original language.'
      gallery:
        layout: gal3
        shots:
          - { image: ../../../assets/velox/prices.png, label: Services and prices, size: 1440 × 900, ratio: 16x10 }
          - { image: ../../../assets/velox/works.png, label: Before/after gallery, size: 1440 × 900, ratio: 16x10 }
          - { image: ../../../assets/velox/mobile.png, label: Mobile version, size: 390 × 844, ratio: 9x19 }

    - title: Online booking
      flow:
        steps:
          - { b: Service, d: Chosen from the studio catalogue }
          - { b: Specialist, d: 'Picked by the client where the service allows it' }
          - { b: Time, d: Only available slots }
          - { b: Contact details, d: 'Name, phone, car model optional' }
        result: { b: Confirmation, d: 'Booking number, calendar file and a cancellation page available until the deadline' }
      after: 'The website, admin panel and bot validate bookings against the same rules; overlapping slots are additionally guarded by database-level constraints.'
      gallery:
        layout: single
        shots:
          - { image: ../../../assets/velox/booking.png, label: 'Online booking: picking a date and time', size: 1440 × 900, ratio: 16x10 }

    - title: Admin panel
      text: 'The studio’s workspace, from schedules and staff workload to site content. Access is split by role.'
      list:
        - Schedules and staff workload
        - Services, prices and specialists
        - Clients and bookings
        - Site content, media and reviews
        - Settings and staff access
        - 'Roles: owner, administrator, specialist'
        - Client data deletion on request (Russian Federal Law 152-FZ)
        - Daily backups
      gallery:
        layout: gal2
        shots:
          - { image: ../../../assets/velox/admin-schedule.png, label: 'Admin panel: the day’s bookings by bay', size: 1440 × 900, ratio: 16x10 }
          - { image: ../../../assets/velox/admin-services.png, label: 'Admin panel: services and prices', size: 1440 × 900, ratio: 16x10 }

    - title: Telegram bot
      panels:
        - title: For clients
          items:
            - Book a service
            - Mini App with a calendar of free slots
            - “My bookings” section
            - Reschedule or cancel
            - Ask the administrator a question
            - Reminders 24 hours and 2 hours ahead
        - title: For the studio
          items:
            - New requests arrive in the administrators’ chat
            - “Confirm”, “Assign specialist” and “Decline” buttons
      gallery:
        layout: galp
        shots:
          - { image: ../../../assets/velox/bot-miniapp.png, label: 'Mini App: picking a date and time', size: 390 × 844, ratio: 9x19 }
          - { image: ../../../assets/velox/bot-admin-chat.png, label: 'Admin chat: new request', size: 390 × 844, ratio: 9x19 }

    - id: stack
      title: Tech stack
      stack:
